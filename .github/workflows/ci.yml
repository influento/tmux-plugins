name: CI

# One job in an Arch Linux container, so the tests run against the tmux the
# workstations run (ubuntu-latest ships an older one), and the release is
# built by the same toolchain the tests just ran. The official image is
# amd64 only; the arm64 binaries are cross-compiled and never run here.
#
# Every push and pull request runs vet and the tests. A v* tag, pushed by
# `make release`, also builds the assets and publishes the release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

env:
  # The dotfiles commit whose bash scripts the characterization tests run.
  # It stays valid after the cutover deletes the scripts from dotfiles.
  DOTFILES_REF: e4fa368842a1330d174f8270b29cb380719ef4db

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed go tmux git fzf zsh python util-linux
          tmux -V
          go version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: influento/dotfiles
          ref: ${{ env.DOTFILES_REF }}
          path: .dotfiles

      # As a normal user: root skews file-mode and lock tests.
      - name: Vet and test
        run: |
          useradd -m tester
          chown -R tester: "$GITHUB_WORKSPACE"
          su tester -c 'cd "$GITHUB_WORKSPACE" && make test DOTFILES="$GITHUB_WORKSPACE/.dotfiles" TMUXTEST_REQUIRE=1'
        env:
          TMUXTEST_REQUIRE: '1'

      - name: Build release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: su tester -c 'cd "$GITHUB_WORKSPACE" && make dist VERSION="${{ github.ref_name }}"'

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
